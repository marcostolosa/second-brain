# === Source sensitivity & handling policy ===
# Classifies incoming material for risk. HIGH-risk content requires MANUAL review
# and is NEVER auto-synced, NEVER auto-sent to Jev/external models, NEVER described
# as "read" until a human approves. Matching is advisory + enforced in Python
# (src/secondbrain/policy.py): a match raises the item's risk and sets needs_review.

default_risk: low

# Domains/sources trusted for automatic public ingestion.
public_allow_domains:
  - "x.com"
  - "twitter.com"
  - "fxtwitter.com"
  - "fixupx.com"
  - "api.fxtwitter.com"
  - "github.com"
  - "raw.githubusercontent.com"
  - "obsidian.md"
  - "arxiv.org"
  - "teapawt.net"

# Keyword/pattern signals that elevate risk and force manual review.
sensitive_signals:
  # HIGH = genuinely sensitive if present in captured content -> held for review,
  # never auto-synced/sent. Kept high-precision so public technical docs that merely
  # discuss these topics are NOT held (those are MEDIUM below).
  high:
    # real embedded secret, not a mention
    - "(?i)BEGIN (RSA|OPENSSH|EC|DSA)? ?PRIVATE KEY"
    # engagement/legal markers (phrase-level, precise)
    - "(?i)\\bNDA\\b|\\bnon-disclosure\\b|\\bconfidential(ity)?\\b|\\bconfidencial(idade)?\\b"
    - "(?i)client engagement|engagement (report|letter|scope)|rules of engagement|relat[oó]rio de pentest|proposta comercial"
    # identity documents
    - "(?i)\\bssn\\b|\\bcpf\\b|\\brg\\b\\s*n|passport(e)? (no|number|n[uú]mero)"
    - "(?i)\\bmedical record\\b|\\bhealth record\\b|\\bprontu[aá]rio\\b"
    # financial documents (bank statements, Pix, SCR/credit bureau, card, IBAN)
    - "(?i)\\bextrato\\b|\\bbank statement\\b|\\bfatura\\b|\\bcomprovante de pagamento\\b"
    - "(?i)\\bpix\\b|\\bIBAN\\b|\\bboleto\\b|\\bSCR\\b"
    - "(?i)\\bag[êe]ncia\\b.{0,12}\\bconta\\b|\\bsaldo\\b|\\bcart[ãa]o de cr[ée]dito\\b"
    - "(?i)\\bita[uú]\\b|\\bnubank\\b|\\bbradesco\\b|\\bsantander\\b|\\bbanco do brasil\\b|\\bcaixa econ[oô]mica\\b"
  # MEDIUM = ingested and flagged in the report, NOT held. These words are common in
  # public technical content (tool docs, write-ups), so a mention must not block.
  medium:
    - "(?i)\\bpassword\\b|\\bsenha\\b"
    - "(?i)\\bapi[-_ ]?key\\b|\\bsecret\\b|\\btoken\\b|\\bcredential\\b"
    - "(?i)\\bclient\\b|\\bengagement\\b"
    - "(?i)\\binternal\\b|\\bdraft\\b"

# Actions per risk level.
handling:
  low:
    auto_ingest: true
    allow_sync: true
    allow_jev: true
  medium:
    auto_ingest: true
    allow_sync: true
    allow_jev: true
    note: "flag in report"
  high:
    auto_ingest: false      # becomes needs_review
    allow_sync: false       # excluded from Obsidian Sync
    allow_jev: false        # redact before any external call
    note: "MANUAL REVIEW REQUIRED; consider a separate sensitive vault in the future"

# Redaction patterns applied to any text BEFORE it may leave the machine (Jev/Claude).
redact_before_external:
  - "(?i)(api[-_ ]?key\\s*[:=]\\s*)\\S+"
  - "(?i)(authorization:\\s*bearer\\s+)\\S+"
  - "(?i)(password\\s*[:=]\\s*)\\S+"
  - "BEGIN (RSA|OPENSSH|EC) PRIVATE KEY[\\s\\S]+?END (RSA|OPENSSH|EC) PRIVATE KEY"
